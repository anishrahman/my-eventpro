server:
  port: ${SERVER_PORT:5000}

spring:
  application:
    name: eventpro-backend

  datasource:
    url: jdbc:h2:mem:eventprodb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

eventpro:
  jwt:
    secret: eventpro-secret-key-12345678901234567890
    expiration-ms: 86400000

logging:
  level:
    com.eventpro: DEBUG


